<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queueing System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

.body   {
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

#app h1 {
    font-size: 2rem;
    font-weight: 400;
    margin: 0;
}

.header-bar{
    padding: 20px 30px;
}

.left-content {
    background-color: #D9D9D9;
    border-radius: 5px;
    font-weight: 300;
    height: 350px;
}

.right-content {
    background-color: #D9D9D9;
    border-radius: 5px;
    font-weight: 300;
    height: 500px;
}

.button-container {
    display: flex;
    justify-content: center;
}

.button-container button {
    font-size: 16px;
    margin: 2px;
    cursor: pointer;
    border-radius: 15px;
}

.btn {
    padding: 5px 50px;
    background-color: #0077BE;
    color: white;
}

.profile-icon img{
    cursor:pointer;
}

</style>
</head>

<body>

    <div id="app">

<!-- header row -->
    <div class="header-bar d-flex justify-content-between align-items-center">

    <h1>{{queueName}}</h1>

<!-- profile dropdown -->
    <div class="dropdown profile-icon">
        <button class="btn p-0 border-0" data-bs-toggle="dropdown">
            <img src="" class="rounded-circle" width="40" height="40">
        </button>

<ul class="dropdown-menu dropdown-menu-end">

    <li class="text-center p-2">
        <div>Admin User</div>
    </li>

<li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" href="#">
                <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </li>
        </ul>
    </div>
</div>

<!-- navigation buttons -->
    <div class="button-container" role="group">
        <button type="button" class="btn">Queue Display</button>
        <button type="button" class="btn">Encode</button>
        <button type="button" class="btn">User Management</button>
    </div>

<!-- Main Layout -->
<div class="container-fluid mt-4">
<div class="row justify-content-center">

<!-- left container -->
    <div class="col-md-8 p-3">
        <div class="left-content p-4">
            <div id="container">
            </div>
        </div>
    </div>

<!-- right container -->
            <div class="col-md-4 p-3">
                <div class="right-content p-4">
                </div>
            </div>
        </div>
    </div>
</div>

<script>

const { createApp } = Vue;

createApp({
data() {
return {
queueName: "AK Dialysis Center"
}
}
}).mount('#app');

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
