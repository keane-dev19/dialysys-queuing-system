<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encoder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body { font-family:'Segoe UI'; }

/* HEADER */
.header-bar {
    padding:20px 30px;
}

/* ✅ UPDATED VIEWER CONTAINER */
.left-content {
    background:#535353;
    height:75vh;          /* responsive height */
    max-height:900px;     /* cap for large screens */
    min-height:600px;     /* prevents small display */
    border-radius:20px;
    overflow:hidden;
}

/* BUTTONS */
.btn {
    background:#0077BE;
    color:white;
    border-radius:15px;
    margin:3px;
}

.button-container {
    text-align:center;
}

/* PANEL */
.panel {
    position:fixed;
    top:80px;
    right:20px;
    width:300px;
    background:#beb7b7;
    padding:15px;
    border-radius:10px;
}

/* PROFILE */
.profile-icon img {
    cursor:pointer;
}
</style>
</head>

<body>
<div id="app">

<!-- HEADER -->
<div class="header-bar d-flex justify-content-between align-items-center">

    <h2>AK Dialysis Center</h2>

    <!-- PROFILE DROPDOWN -->
    <div class="dropdown profile-icon">
        <button class="btn p-0 border-0" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle" style="font-size:28px;"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
            <li class="text-center p-2">
                <div><strong>Admin User</strong></div>
            </li>
            <li><hr class="dropdown-divider"></li>

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-gear"></i> Settings
                </a>
            </li>

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </li>
        </ul>
    </div>

</div>

<!-- NAV -->
<div class="button-container">
    <button class="btn" @click="showEncode = !showEncode">Encode</button>
    <button class="btn">User Management</button>
</div>

<!-- VIEWER -->
<div class="container-fluid mt-3">
    <div class="left-content">
        <iframe src="../aksviewerpage/viewer.html"
        style="width:100%;height:100%;border:none;"></iframe>
    </div>
</div>

<!-- ENCODE PANEL -->
<div v-if="showEncode" class="panel">

<h5>Add Patient</h5>
<input v-model="newPatient" class="form-control mb-2">

<select v-model.number="duration" class="form-control mb-2">
<option :value="7200">2 Hours</option>
<option :value="14400">4 Hours</option>
</select>

<button class="btn w-100 mb-3" @click="addPatient">Add</button>

<hr>

<h5>Next Shift</h5>
<input v-model="shiftTime" class="form-control mb-2">
<input v-model="cutoff" class="form-control mb-2">
<button class="btn w-100 mb-3" @click="saveShift">Save</button>

<hr>

<h5>On Duty Staff</h5>
<input v-model="staffInput" class="form-control mb-2">
<button class="btn w-100 mb-2" @click="addStaff">Add</button>

<ul>
<li v-for="(s,i) in staff" :key="i">{{s}}</li>
</ul>

<button class="btn w-100" @click="saveStaff">Save Staff</button>

</div>

</div>

<script>
const { createApp } = Vue;

createApp({

data(){
return{
    showEncode:false,

    newPatient:'',
    duration:7200,

    queue: JSON.parse(localStorage.getItem('queue')||'[]'),

    shiftTime: localStorage.getItem('shiftTime') || '',
    cutoff: localStorage.getItem('cutoff') || '',

    staff: JSON.parse(localStorage.getItem('staff')||'[]'),
    staffInput:''
}
},

methods:{
addPatient(){
    if(!this.newPatient.trim()) return;

    this.queue.push({
        name:this.newPatient,
        remaining:this.duration
    });

    this.saveQueue();
    this.newPatient='';
},

saveQueue(){
    localStorage.setItem('queue', JSON.stringify(this.queue));
},

saveShift(){
    localStorage.setItem('shiftTime', this.shiftTime);
    localStorage.setItem('cutoff', this.cutoff);
},

addStaff(){
    if(!this.staffInput.trim()) return;
    this.staff.push(this.staffInput);
    this.staffInput='';
},

saveStaff(){
    localStorage.setItem('staff', JSON.stringify(this.staff));
}
}

}).mount('#app');
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
