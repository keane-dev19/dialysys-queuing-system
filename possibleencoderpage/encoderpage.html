<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queueing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!--Styles-->
    <style>
        #app h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-left: 2rem;
            padding-top: 2rem;
        }
        .navLinks {
            font-size: small;
        }
        .navLinks .nav-link {
            background-color: #0077BE;
            color: #fcf9f9;
            border-radius: 5px;
            padding: 0.5rem 1rem;
        }
        .left-content, .right-content {
            background-color: #D9D9D9;
            border-radius: 5px;
            font-weight: 300;
        }
        .left-content h2, .right-content h2 {
            font-size: 1;
            margin-top: 0;    
        }
       .button-container {
            display: flex;
            justify-content: center;
       }   
        .button-container button {
        font-size: 16px;
        margin: 2px ;
        cursor: pointer;
        border-radius: 15px;
        }
        .btn {
            padding: 5px 50px;
            background-color: #0077BE;
        }
    </style>
</head>

<body scroll="no" style="overflow: hidden">

    <div id="app">

        <h1> {{queueName}} </h1>

<!-- Navigation Buttons -->
    <div class="button-container" role="group" aria-label="Button Group">
        <button type="button" class="btn">Queue Display</button>
        <button type="button" class="btn">Encode</button>
        <button type="button" class="btn">User Management</button>
    </div>

    <div class="left container min-vh-100 d-flex flex-column">
        <div class="row flex-grow-1">
            <div class="col-md-7 p-4">
                <div class="left-content p-4">
                </div>
            </div>

   <div class="right container min-vh-100 d-flex flex-column">
        <div class="row flex-grow-1">
            <div class="col-md-7 p-4">
                <div class="right-content p-4">
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script>

//VUE
const { createApp } = Vue;
createApp({
    data() {
        return {
            queueName: "AK Dialysis Center"
        }
    }
}).mount('#app');
        </script>


</body>

    
</html>
