<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
html,body{height:100%;margin:0;overflow:hidden;font-family:'Segoe UI';}
#app{height:100%;display:flex;flex-direction:column;}

.top-row{flex:1;}
.bottom-row{height:30vh;}

.left-content,.bottom-left-content,.bottom-right-content{
background:#1877A9;color:white;
}

.right-content{background:black;}

.patient-card{
background:#e6e6e6;
border-radius:20px;
padding:6px 10px;
display:flex;
margin-bottom:8px;
align-items:center;
}

.status-dot{
width:8px;height:8px;background:#00ff44;border-radius:50%;margin-right:8px;
}

.patient-time{margin-left:auto;}

video{width:100%;height:100%;object-fit:cover;}

.next-title{font-style:italic;font-weight:700;text-decoration:underline;}

.staff-pill{
background:white;color:black;border-radius:20px;padding:4px 10px;font-size:.8rem;
}

.progress-pill{
background:#d9d9d9;border-radius:20px;width:120px;
}

.dot-orange{
width:8px;height:8px;background:#ffa500;border-radius:50%;display:inline-block;margin-right:6px;
}

.divider{
width:2px;background:white;height:80%;margin:0 15px;
}

.duty-card{
background:#a9c4d6;color:black;border-radius:20px;padding:10px;margin-bottom:10px;
}

.dot-blue{
width:10px;height:10px;background:#0066ff;border-radius:50%;display:inline-block;margin-right:6px;
}
</style>
</head>

<body>
<div id="app">

<!-- TOP -->
<div class="container-fluid top-row">
<div class="row h-100">

<div class="col-md-3">
<div class="left-content p-3 d-flex flex-column">

<h4 class="text-center">AK Dialysis Center</h4>
<div class="text-center">{{dateTime}}</div>
<div class="text-center fst-italic mt-2">On Going Treatment</div>

<div class="flex-grow-1 mt-2">

<div v-for="(p,i) in queue" :key="i" class="patient-card">
    <div class="status-dot"></div>
    <div>{{p.name}}</div>
    <div class="patient-time">{{formatTime(p.remaining)}}</div>
</div>

</div>

</div>
</div>

<div class="col-md-9 right-content">
<video controls>
<source src="2759477-uhd_3840_2160_30fps.mp4">
</video>
</div>

</div>
</div>

<!-- BOTTOM -->
<div class="container-fluid bottom-row">
<div class="row h-100">

<div class="col-md-8 bottom-left-content d-flex align-items-center p-3">

<div>
<div class="next-title">Next Shift</div>
<div>{{shiftTime}}</div>
<div style="font-size:.75rem;">{{cutoff}}</div>
</div>

<div class="divider"></div>

<div>
<div class="d-flex gap-2 mb-2" v-for="i in 3">
    <div class="staff-pill"><span class="dot-orange"></span>Next Patient</div>
    <div class="progress-pill"></div>
</div>
</div>

</div>

<div class="col-md-4 bottom-right-content p-3">

<div v-for="(s,i) in staff" :key="i" class="duty-card">
<span class="dot-blue"></span>
<strong>On Duty</strong><br>
{{s}}
</div>

</div>

</div>
</div>

</div>

<script>
const { createApp } = Vue;

createApp({

data(){
return{
queue: [],
shiftTime:'',
cutoff:'',
staff:[],
dateTime:''
}
},

methods:{
loadData(){
this.queue = JSON.parse(localStorage.getItem('queue')||'[]');
this.shiftTime = localStorage.getItem('shiftTime') || '';
this.cutoff = localStorage.getItem('cutoff') || '';
this.staff = JSON.parse(localStorage.getItem('staff')||'[]');
},

formatTime(sec){
let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
let s=sec%60;
return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
},

tick(){
if(this.queue.length>0){
if(this.queue[0].remaining>0){
this.queue[0].remaining--;
}else{
this.queue.shift();
}
localStorage.setItem('queue', JSON.stringify(this.queue));
}
this.dateTime = new Date().toLocaleString();
}
},

mounted(){
this.loadData();

/* SAFE SINGLE TIMER */
setInterval(()=>{
this.loadData();   // sync first
this.tick();       // then update
},1000);
}

}).mount('#app');
</script>

</body>
</html>
