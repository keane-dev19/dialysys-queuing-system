<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
html,body{
height:100%;
margin:0;
overflow:hidden;
font-family:'Segoe UI';
}

/* GLOBAL SCALE */
body{
font-size:clamp(13px, 1vw, 16px);
}

#app{
height:100%;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* LAYOUT */
.top{
flex:1;
display:flex;
overflow:hidden;
}

.bottom{
height:120px;
display:flex;
overflow:hidden;
}

/* LEFT PANEL */
.left{
width:35%;
background:#1877A9;
color:white;
display:flex;
flex-direction:column;
padding:10px;
overflow:hidden;
}

/* HEADER TEXT */
.left-header{
text-align:center;
font-size:clamp(14px, 1.2vw, 18px);
font-weight:600;
}

/* QUEUE */
.queue{
flex:1;
overflow-y:auto;
margin-top:5px;
}

/* PATIENT CARD */
.patient-card{
background:#e6e6e6;
border-radius:18px;
padding:8px 12px;
display:flex;
margin-bottom:8px;
align-items:center;
font-size:clamp(13px, 1vw, 15px);
}

.status-dot{
width:8px;
height:8px;
background:#00ff44;
border-radius:50%;
margin-right:8px;
}

.patient-time{
margin-left:auto;
font-size:0.9em;
}

/* VIDEO */
.right{
flex:1;
background:black;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.video-wrapper{
width:100%;
height:100%;
aspect-ratio:16/9;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* BOTTOM */
.bottom-left{
flex:2;
background:#1877A9;
color:white;
padding:10px;
display:flex;
align-items:center;
gap:15px;
overflow:hidden;
}

.bottom-right{
flex:1;
background:#1877A9;
padding:10px;
overflow-y:auto;
}

/* TEXT */
.next-title{
font-size:clamp(13px, 1vw, 16px);
font-weight:bold;
}

/* STAFF */
.staff-pill{
background:white;
color:black;
border-radius:15px;
padding:4px 10px;
font-size:clamp(12px, 0.9vw, 14px);
}

.progress-pill{
background:#d9d9d9;
border-radius:20px;
width:100px;
height:8px;
}

/* DUTY */
.duty-card{
background:#a9c4d6;
border-radius:12px;
padding:8px;
font-size:clamp(12px, 0.9vw, 14px);
margin-bottom:6px;
}

.dot-blue{
width:8px;
height:8px;
background:#0066ff;
border-radius:50%;
display:inline-block;
margin-right:5px;
}
</style>
</head>

<body>
<div id="app">

<!-- TOP -->
<div class="top">

<!-- LEFT -->
<div class="left">
<div class="left-header">AK Dialysis Center</div>
<div class="text-center small">{{dateTime}}</div>

<div class="queue">

<div v-for="(p,i) in queue" :key="i" class="patient-card">
    <div class="status-dot"></div>
    <div class="text-truncate">{{p.name}}</div>
    <div class="patient-time">{{formatTime(p.remaining)}}</div>
</div>

</div>
</div>

<!-- RIGHT -->
<div class="right">
<div class="video-wrapper">
<video autoplay muted loop playsinline>
<source src="2759477-uhd_3840_2160_30fps.mp4">
</video>
</div>
</div>

</div>

<!-- BOTTOM -->
<div class="bottom">

<div class="bottom-left">

<div>
<div class="next-title">Next Shift</div>
<div>{{shiftTime}}</div>
<div style="font-size:.75rem;">{{cutoff}}</div>
</div>

<div>
<div v-for="i in 2" class="d-flex align-items-center gap-2 mb-2">
<div class="staff-pill">Next Patient</div>
<div class="progress-pill"></div>
</div>
</div>

</div>

<div class="bottom-right">
<div v-for="(s,i) in staff" :key="i" class="duty-card">
<span class="dot-blue"></span> {{s}}
</div>
</div>

</div>

</div>

<script>
const { createApp } = Vue;

createApp({

data(){
return{
queue:[],
shiftTime:'',
cutoff:'',
staff:[],
dateTime:''
}
},

methods:{
loadData(){
this.queue = JSON.parse(localStorage.getItem('queue')||'[]');
this.shiftTime = localStorage.getItem('shiftTime') || '';
this.cutoff = localStorage.getItem('cutoff') || '';
this.staff = JSON.parse(localStorage.getItem('staff')||'[]');
},

formatTime(sec){
let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
let s=sec%60;
return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
},

tick(){
if(this.queue.length>0){
if(this.queue[0].remaining>0){
this.queue[0].remaining--;
}else{
this.queue.shift();
}
localStorage.setItem('queue', JSON.stringify(this.queue));
}
this.dateTime = new Date().toLocaleString();
}
},

mounted(){
this.loadData();
setInterval(()=>{
this.loadData();
this.tick();
},1000);
}

}).mount('#app');
</script>

</body>
</html>
