<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/motion-v@2.0.0/dist/motion-v.umd.js"></script>

</head>


<!--Styles-->
<style>
    .left-content {
        background-color: #0077BE;
        font-weight: 100;
        color: white;
        justify-content: center;   
    }
    .bottom-left-content {
        background-color: #0077BE;
        font-weight: 100;
        color: white;
        text-decoration: underline;
        font-size: small;
    }
    .bottom-right-content {
        background-color: #0077BE;  
        flex-wrap: wrap;
        font-weight: 100;
        
        color: white;
    }
    .flashcard {
        background-color: white;
        color: black;
        border-radius: 10px;
        padding: 1rem;
        text-align: center;
        margin-top: 1rem;
    }
    .staff-name {
        font-size: 1.2rem;
        font-weight: bold;
    }
    .form-control {
        border-radius: 15px;
        margin-bottom: 5px;
        color: white;
    }
    .horizontal-list {
        display: flex;
        flex-wrap: wrap;        
        gap: 1rem;
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .horizontal-list li {
        background-color: white;
        color: black;
        text-align: center;
        border-radius: 15px;
        flex: 0 0 calc(33.333% - 1rem); /* three items per row */
    }

</style>
<body>
<!--Containers-->

    <div id="app" class="container-fluid min-vh-100 d-flex flex-column">
        <div class="row first-row">
            <div class="col-md-3 p-4">
                <div class="left-content h-100 p-4">
                    <h3>{{ queueName }}</h3>
                    <div class="Date">
                        <span class="day-of-week">Monday</span>
                        <time datetime="2026-06-01">June 1, 2026</time>
                        <span class="real-time">12:00 PM</span>   
                    </div>
                        <h5>On Going Treatment</h5>
                        <form>
                        <div class="mb-4 list-group justified-content-center">
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                            <input type="text" class="form-control" placeholder="Patient Name" disabled>
                        </div>
                        </form>
                    </div>
                </div>

        <!--Video-->
            <div class="col-md-7 p-4">
                <div class="right-content h-100 p-1">
                    <h2>Video</h2>

                </div>
            </div>
        </div>

        <!-- bottom row -->
        <div class="row">
            <div class="col-md-8 p-4">
                <div class="bottom-left-content h-100 p-4 d-flex align-items-center justify-content-between">
                    <div class="shift-info">
                        <h3>Next Shift</h3>
                        <time>10:00 PM - 10:30 AM</time>
                        <p>cutoff time</p>
                    </div>
                    <ul class="horizontal-list">
                        <li>Patient 1</li>
                        <li>Patient 2</li>
                        <li>Patient 3</li>
                        <li>Patient 4</li>
                        <li>Patient 5</li>
                        <li>Patient 6</li>
                        <li>Patient 7</li>
                        <li>Patient 8</li>
                        <li>Patient 9</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-4 p-4">
                <div class="bottom-right-content h-100 p-3">
                    <div class="flashcard">
                        <p>On Duty:</p>
                        <motion
                            is="div"
                            class="staff-name"
                            :initial="{ opacity: 1 }"
                            :animate="{ opacity: 1, scale: 1 }"
                            :transition="{ type: 'spring', stiffness: 50 }"
                            :key="currentStaffIndex"> {{ currentStaff }} </motion>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>


<script>
//VUE
const { createApp } = Vue;
const motion = window.motion;
createApp({
    data() {
        return {
            queueName: "AK Dialysis Center",
            staff: ["Dr. John Doe", "Nurse Melly", "Tech. Nick", "Dr. Niel", "Nurse Ery Rhymes"],
            currentStaffIndex: 0,
            isPaused: false
        }
    },
    computed: {
        currentStaff() {
            return this.staff[this.currentStaffIndex];
        }
    },
    methods: {
        togglePause() {
            this.isPaused = !this.isPaused;
        }
    },
    mounted() {
        setInterval(() => {
            if (!this.isPaused) {
                this.currentStaffIndex = (this.currentStaffIndex + 1) % this.staff.length;
            }
        }, 2000); // change every 2 seconds
    }
}).use(motion).mount('#app');



</script>

</html>
